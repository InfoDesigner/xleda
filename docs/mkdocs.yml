site_name: xleda
docs_dir: docs

nav:
  - Home: index.md

theme:
  name: material
  logo: assets/images/rectangle_icon.png
  favicon: assets/images/rectangle_icon.png
  palette:
    - scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      accent: deep purple
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      accent: deep purple
  features:
    - toc.integrate
    - navigation.top
    - navigation.instant
    - content.code.copy

extra_javascript:
  - js/cloudflare.js

markdown_extensions:
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search
  - badges
  - include-markdown
