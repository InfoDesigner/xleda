# Build system
[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

# Project Metadta
[project]
name = "xleda"
version = "0.9.001"
description = "xleda is a Microsoft Excel powered EDA tool for Python data"
readme = "README.md"
authors = [{ name = "InfoDesigner", email = "101991676+InfoDesigner@users.noreply.github.com" }]
license = {text = "Apache-2.0"} 
requires-python = ">=3.10"
dependencies = [
    "ipywidgets>=7.7.1",
    "matplotlib>=3.6.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "seaborn>=0.13.0",
    "xlwings>=0.35.2",
    "send2trash>=2.1.0",
    "tqdm>=4.66.0",
    "appscript>=1.4.0 ; sys_platform == 'darwin'",
    # Datasource readers
    "pyarrow>=24.0.0",
    "duckdb>=1.5.3",
    "rdata>=0.11.2",
    "typer>=0.26.7",
    "pipx>=1.15.0",
]

classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Visual Basic",
    "Topic :: Database :: Front-Ends",
    "Topic :: Documentation",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules"
    ]

[project.scripts]
xleda = "xleda.cli:cli"


[project.urls]
Homepage = "https://github.com/InfoDesigner/xleda"
Issues = "https://github.com/InfoDesigner/xleda/issues"


# Other dependency groups
[dependency-groups]
dev = [
    "faker>=40.18.0",
    "missingno>=0.4.0",
    "notebook>=7.5.6",
    "openml>=0.15.1",
    "pyinstrument>=5.1.2",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "types-seaborn>=0.13.2.20260518",
    "types-tqdm>=4.67.3.20260518",
    "types-send2trash>=2.1.0.20260408",
    "ucimlrepo>=0.0.7",
    "twine>=6.2.0",
    "mkdocs>=1.6.1",
    "mkdocs-include-markdown-plugin>=7.3.0",
    "mkdocs-material>=9.7.6",
    "mkdocs-badges>=0.6.0",
]


# Tool Configurations
[tool.uv]
required-environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",]

[tool.ruff]
line-length = 120


[tool.pytest.ini_options]
addopts = "-p no:faulthandler --tb=no"


[tool.pyrefly]
# Disable gitignore scanning — the *.pyc/*.ipynb gitignore patterns
# caused pyrefly to skip all Python files via glob overlap.
# Run `uv run pyrefly check .` or `uv run pyrefly check src` manually.
use-ignore-files = false

project-includes = [
    "src/**/*.py",
    "tests/**/*.py",
    "tools/**/*.py",
    "examples/**/*.py",
]
project-excludes = [
    "**/__pycache__/**",
    "**/.venv/**",
]
