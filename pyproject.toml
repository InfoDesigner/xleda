[project]
name = "xleda"
version = "0.8"
description = "xleda is a Microsoft Excel powered EDA tool for Python data"
readme = "README.md"
authors = [
    { name = "InfoDesigner", email = "101991676+InfoDesigner@users.noreply.github.com" }
]
license = {text = "Apache-2.0"} 

requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]


dependencies = [
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
    "xlwings>=0.35.2",
]


[project.scripts]
my-package = "xleda:main"


[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dython>=0.7.12",
    "faker>=40.15.0",
    "missingno>=0.5.2",
    "notebook>=7.5.6",
    "pyarrow>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/InfoDesigner/xleda"
Issues = "https://github.com/InfoDesigner/xleda/issues"


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true