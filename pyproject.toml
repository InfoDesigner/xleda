[project]
name = "xleda"
version = "0.5.0"
description = "xleda is a Microsoft Excel powered EDA tool for Python data"
readme = "README.md"
authors = [
    { name = "InfoDesigner", email = "101991676+InfoDesigner@users.noreply.github.com" }
]
license = "Apache-2.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]


requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pyarrow>=24.0.0",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
    "xlwings>=0.35.2",
]


[project.scripts]
my-package = "xleda:main"


[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "faker>=40.15.0",
]
