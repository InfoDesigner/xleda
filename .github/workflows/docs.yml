name: Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
        
      - run: pip install zensical mkdocs-badges pymdown-extensions

      - name: Build Documentation
        run: |
          
          cp -f readme.md docs/index.md
          zensical build -f docs/zensical.toml --clean

      # FIX 3: Point the upload artifact to the freshly generated site directory
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
          
      - uses: actions/deploy-pages@v5
        id: deployment