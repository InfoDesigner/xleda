name: Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          
      - run: pip install zensical mkdocs-badges mkdocs-include-markdown-plugin
      
      # Run your exact local command from the root workspace
      - name: Build Documentation
        run: zensical build -f docs/zensical.toml --clean
      
      # FIX: Point exactly to the nested folder that holds your index.html file!
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
          
      - uses: actions/deploy-pages@v5
        id: deployment