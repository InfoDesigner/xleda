name: Documentation
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical mkdocs-badges
      
      # FIX 1: Change -f to --config so Zensical reads your parameters
      - run: zensical build --config-file docs/zensical.toml --clean
      
      # FIX 2: Change path to site since Zensical compiles to the base execution root
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          
      - uses: actions/deploy-pages@v5
        id: deployment
