name: Debug Documentation Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.12
          
      - name: Install dependencies
        run: pip install zensical mkdocs-badges

      # ----------------------------------------------------
      # STEP 1: Check what the directory looks like BEFORE building
      # ----------------------------------------------------
      # This lets us verify exactly where your symlinks and zensical.toml sit
      - name: Pre-Build Diagnostics
        run: |
          echo "=== CURRENT WORKING DIRECTORY ==="
          pwd
          echo "=== SYSTEM DIRECTORY TREE ==="
          find . -maxdepth 3 -not -path '*/.*'

      # ----------------------------------------------------
      # STEP 2: Run your exact local command
      # ----------------------------------------------------
      - name: Execute Local Build Command
        run: zensical build -f docs/zensical.toml --clean

      # ----------------------------------------------------
      # STEP 3: Find exactly where the HTML files landed
      # ----------------------------------------------------
      # This looks for any file named 'index.html' across the entire runner space
      - name: Post-Build File Finder
        run: |
          echo "=== SEARCHING FOR COMPILED INDEX.HTML ==="
          find . -name "index.html"
          echo "=== FULL POST-BUILD OUTPUT FOLDER TREE ==="
          find . -name "site" -type d -exec echo "Found site folder at: {}" \; -exec ls -R {} \;
